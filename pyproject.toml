[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "annual-report-docling-pipeline"
version = "0.1.0"
description = "Docling extraction pipeline for Colombo Stock Exchange annual reports."
requires-python = ">=3.11"
dependencies = [
    "docling",
    "pyyaml",
    "typer",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
docling-pipeline = "docling_pipeline.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
