run_id: baseline_colab
data:
  reports_dir: data/reports
  parsed_dir: data/parsed
  gold_dir: data/gold
  extracted_dir: data/extracted
parse:
  engine: colab
  import_dir: G:/My Drive/chunkwise-cse/extracted_egret_large
  ocr: false
  table_mode: accurate
  exclude_dirs: [Interim]
prepare:
  strategy: whole_report
  params:
    prompt_reserve: 1536
    token_safety: 0.85
models:
  - name: llama3.2:3b
    num_ctx: 32768
  - name: qwen2.5:3b
    num_ctx: 32768
  - name: phi4
    num_ctx: 16384
  - name: gemma2:2b
    num_ctx: 8192
inference:
  backend: ollama
  runs: 3
  seed: 42
  temperature: 0.0
  max_new_tokens: 1024
  keep_alive: 10m
prompts: [summary, facts, risks]
scoring:
  bertscore: false
ranking_weights:
  accuracy: 0.40
  hallucination: 0.25
  json: 0.15
  efficiency: 0.20
analysis:
  length_bins: [0, 8000, 16000, 32000, 64000]
